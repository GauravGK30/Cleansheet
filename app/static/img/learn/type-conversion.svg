<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Data type conversion</title>
<desc id="dsc">Three conversions. The text 1,200 becomes the number 1200. The text 2024-03-05 becomes a date. The text 12.5 cannot become a whole number, so that column is skipped.</desc>
<defs>
<style>
.bg{fill:#fff;stroke:#d7ddd9;stroke-width:1.5}
.cell{fill:#fff;stroke:#b9c3bd;stroke-width:1.4}
.hdr{fill:#f6f8f7;stroke:#b9c3bd;stroke-width:1.4}
.gap{fill:url(#hatch);stroke:#b9c3bd;stroke-width:1.4}
.pad{fill:url(#hatch);stroke:none}
.ok{fill:#e2f1e8;stroke:#17724a;stroke-width:1.6}
.mark{fill:#fff0a0;stroke:#c9a800;stroke-width:1.6}
.bad{fill:#fdecea;stroke:#b3261e;stroke-width:1.6}
.info{fill:#e8f0f7;stroke:#1f4e79;stroke-width:1.6}
.sel{fill:none;stroke:#17724a;stroke-width:2.6}
.handle{fill:#17724a;stroke:#fff;stroke-width:2}
.accfill{fill:#17724a}
.onacc{fill:#fff;font-weight:700}
.hatchline{stroke:#56655d;stroke-opacity:.5;stroke-width:1.3}
.t{fill:#18231e}
.tb{fill:#18231e;font-weight:700}
.s{fill:#56655d}
.sb{fill:#56655d;font-weight:700}
.acc{fill:#0f5836;font-weight:700}
.mk{fill:#4d3f00}
.bd{fill:#b3261e;font-weight:700}
.nf{fill:#1f4e79;font-weight:700}
.wt{fill:#8a5300;font-weight:700}
.line{stroke:#56655d;stroke-width:1.6;fill:none}
.arrow{stroke:#17724a;stroke-width:2.4;fill:none}
.arrowhead{fill:#17724a}
.strike{stroke:#b3261e;stroke-width:2.2;fill:none}
.bar{fill:#b9c3bd}
.baracc{fill:#17724a}
.accline{stroke:#17724a;stroke-width:2.6;fill:none}
.dashacc{stroke:#17724a;stroke-width:2;stroke-dasharray:6 4;fill:none}
.warnline{stroke:#8a5300;stroke-width:2.2;stroke-dasharray:6 4;fill:none}
.dot{fill:#56655d}
.dotwarn{fill:#8a5300}
.dashed{stroke-dasharray:5 4}
.f{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
@media (prefers-color-scheme:dark){
.bg{fill:#171e1b;stroke:#2b3732}
.cell{fill:#1d2622;stroke:#3d4c45}
.hdr{fill:#232e29;stroke:#3d4c45}
.gap{stroke:#3d4c45}
.ok{fill:#1b3a2b;stroke:#4cc38a}
.mark{fill:#5a4e10;stroke:#b39b22}
.bad{fill:#3a1c1a;stroke:#ff9a92}
.info{fill:#1a2a3a;stroke:#9cc4ec}
.sel{stroke:#4cc38a}
.handle{fill:#4cc38a;stroke:#171e1b}
.accfill{fill:#4cc38a}
.onacc{fill:#07140e}
.hatchline{stroke:#9aaba2;stroke-opacity:.5}
.t,.tb{fill:#e6ede9}
.s,.sb{fill:#9aaba2}
.acc{fill:#7bd9ab}
.mk{fill:#fff3b0}
.bd{fill:#ff9a92}
.nf{fill:#9cc4ec}
.wt{fill:#f0c36b}
.line{stroke:#9aaba2}
.arrow{stroke:#4cc38a}
.arrowhead{fill:#4cc38a}
.strike{stroke:#ff9a92}
.bar{fill:#3d4c45}
.baracc{fill:#4cc38a}
.accline{stroke:#4cc38a}
.dashacc{stroke:#4cc38a}
.warnline{stroke:#f0c36b}
.dot{fill:#9aaba2}
.dotwarn{fill:#f0c36b}
}
</style>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="hatchline"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="1" y="1" width="638" height="298" rx="6"/>
<text class="sb f" x="60" y="32" font-size="12.5" text-anchor="start">As text</text>
<text class="sb f" x="326" y="32" font-size="12.5" text-anchor="start">After converting</text>
<rect class="cell" x="60" y="44" width="170" height="46" rx="2"/>
<text class="t m" x="71" y="72.2" font-size="14.5" text-anchor="start">"1,200"</text>
<path class="arrow" d="M238 67L316 67" marker-end="url(#ah)"/>
<text class="s f" x="277" y="58" font-size="11.5" text-anchor="middle">whole number</text>
<rect class="cell" x="60" y="110" width="170" height="46" rx="2"/>
<text class="t m" x="71" y="138.2" font-size="14.5" text-anchor="start">"2024-03-05"</text>
<path class="arrow" d="M238 133L316 133" marker-end="url(#ah)"/>
<text class="s f" x="277" y="124" font-size="11.5" text-anchor="middle">date</text>
<rect class="cell" x="60" y="176" width="170" height="46" rx="2"/>
<text class="t m" x="71" y="204.2" font-size="14.5" text-anchor="start">"12.5"</text>
<path class="arrow" d="M238 199L316 199" marker-end="url(#ah)"/>
<text class="s f" x="277" y="190" font-size="11.5" text-anchor="middle">whole number</text>
<rect class="ok" x="326" y="44" width="160" height="46" rx="2"/>
<text class="t m" x="475" y="72.4" font-size="15" text-anchor="end">1200</text>
<rect class="ok" x="326" y="110" width="160" height="46" rx="2"/>
<rect class="cell" x="336" y="122" width="20" height="20" rx="2"/>
<rect class="accfill" x="336" y="122" width="20" height="6" rx="2"/>
<circle class="dot" cx="342" cy="134" r="1.6"/><circle class="dot" cx="350" cy="134" r="1.6"/><circle class="dot" cx="342" cy="139" r="1.6"/><circle class="dot" cx="350" cy="139" r="1.6"/>
<text class="t m" x="366" y="138.2" font-size="14.5" text-anchor="start">2024-03-05</text>
<rect class="bad" x="326" y="176" width="160" height="46" rx="2"/>
<text class="bd m" x="406.0" y="204.4" font-size="15" text-anchor="middle">skipped</text>
<text class="s f" x="500" y="64" font-size="12" text-anchor="start">Comma removed.</text>
<text class="s f" x="500" y="130" font-size="12" text-anchor="start">Checked: a real date.</text>
<text class="s f" x="500" y="194" font-size="12" text-anchor="start">12.5 is not whole:</text>
<text class="s f" x="500" y="210" font-size="12" text-anchor="start">column skipped,</text>
<text class="s f" x="500" y="226" font-size="12" text-anchor="start">originals stay.</text>
<text class="s f" x="320" y="266" font-size="12.5" text-anchor="middle">One invalid value is enough to skip the column. Nothing is half-converted.</text>
</svg>
