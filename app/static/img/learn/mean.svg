<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Mean imputation</title>
<desc id="dsc">Bars for three prices, 2.50, 3.50 and 3.00, with a dashed line at their mean of 3.00. The missing fourth bar is hatched and reaches the mean line.</desc>
<defs>
<style>
.bg{fill:#fff;stroke:#d7ddd9;stroke-width:1.5}
.cell{fill:#fff;stroke:#b9c3bd;stroke-width:1.4}
.hdr{fill:#f6f8f7;stroke:#b9c3bd;stroke-width:1.4}
.gap{fill:url(#hatch);stroke:#b9c3bd;stroke-width:1.4}
.pad{fill:url(#hatch);stroke:none}
.ok{fill:#e2f1e8;stroke:#17724a;stroke-width:1.6}
.mark{fill:#fff0a0;stroke:#c9a800;stroke-width:1.6}
.bad{fill:#fdecea;stroke:#b3261e;stroke-width:1.6}
.info{fill:#e8f0f7;stroke:#1f4e79;stroke-width:1.6}
.sel{fill:none;stroke:#17724a;stroke-width:2.6}
.handle{fill:#17724a;stroke:#fff;stroke-width:2}
.accfill{fill:#17724a}
.onacc{fill:#fff;font-weight:700}
.hatchline{stroke:#56655d;stroke-opacity:.5;stroke-width:1.3}
.t{fill:#18231e}
.tb{fill:#18231e;font-weight:700}
.s{fill:#56655d}
.sb{fill:#56655d;font-weight:700}
.acc{fill:#0f5836;font-weight:700}
.mk{fill:#4d3f00}
.bd{fill:#b3261e;font-weight:700}
.nf{fill:#1f4e79;font-weight:700}
.wt{fill:#8a5300;font-weight:700}
.line{stroke:#56655d;stroke-width:1.6;fill:none}
.arrow{stroke:#17724a;stroke-width:2.4;fill:none}
.arrowhead{fill:#17724a}
.strike{stroke:#b3261e;stroke-width:2.2;fill:none}
.bar{fill:#b9c3bd}
.baracc{fill:#17724a}
.accline{stroke:#17724a;stroke-width:2.6;fill:none}
.dashacc{stroke:#17724a;stroke-width:2;stroke-dasharray:6 4;fill:none}
.warnline{stroke:#8a5300;stroke-width:2.2;stroke-dasharray:6 4;fill:none}
.dot{fill:#56655d}
.dotwarn{fill:#8a5300}
.dashed{stroke-dasharray:5 4}
.f{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
@media (prefers-color-scheme:dark){
.bg{fill:#171e1b;stroke:#2b3732}
.cell{fill:#1d2622;stroke:#3d4c45}
.hdr{fill:#232e29;stroke:#3d4c45}
.gap{stroke:#3d4c45}
.ok{fill:#1b3a2b;stroke:#4cc38a}
.mark{fill:#5a4e10;stroke:#b39b22}
.bad{fill:#3a1c1a;stroke:#ff9a92}
.info{fill:#1a2a3a;stroke:#9cc4ec}
.sel{stroke:#4cc38a}
.handle{fill:#4cc38a;stroke:#171e1b}
.accfill{fill:#4cc38a}
.onacc{fill:#07140e}
.hatchline{stroke:#9aaba2;stroke-opacity:.5}
.t,.tb{fill:#e6ede9}
.s,.sb{fill:#9aaba2}
.acc{fill:#7bd9ab}
.mk{fill:#fff3b0}
.bd{fill:#ff9a92}
.nf{fill:#9cc4ec}
.wt{fill:#f0c36b}
.line{stroke:#9aaba2}
.arrow{stroke:#4cc38a}
.arrowhead{fill:#4cc38a}
.strike{stroke:#ff9a92}
.bar{fill:#3d4c45}
.baracc{fill:#4cc38a}
.accline{stroke:#4cc38a}
.dashacc{stroke:#4cc38a}
.warnline{stroke:#f0c36b}
.dot{fill:#9aaba2}
.dotwarn{fill:#f0c36b}
}
</style>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="hatchline"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="1" y="1" width="638" height="298" rx="6"/>
<text class="sb f" x="40" y="36" font-size="13" text-anchor="start">Prices of four items, one unknown</text>
<path class="line" d="M50 232L420 232"/>
<rect class="bar" x="80" y="117.0" width="60" height="115.0" rx="2"/>
<text class="t f" x="110.0" y="109.0" font-size="13" text-anchor="middle">2.50</text>
<text class="s f" x="110.0" y="252" font-size="13" text-anchor="middle">Tea</text>
<rect class="bar" x="160" y="71.0" width="60" height="161.0" rx="2"/>
<text class="t f" x="190.0" y="63.0" font-size="13" text-anchor="middle">3.50</text>
<text class="s f" x="190.0" y="252" font-size="13" text-anchor="middle">Coffee</text>
<rect class="gap dashed" x="240" y="94.0" width="60" height="138.0" rx="2"/>
<text class="acc f" x="270.0" y="86.0" font-size="14" text-anchor="middle">3.00</text>
<text class="s f" x="270.0" y="252" font-size="13" text-anchor="middle">Milk</text>
<rect class="bar" x="320" y="94.0" width="60" height="138.0" rx="2"/>
<text class="t f" x="350.0" y="86.0" font-size="13" text-anchor="middle">3.00</text>
<text class="s f" x="350.0" y="252" font-size="13" text-anchor="middle">Juice</text>
<path class="dashacc" d="M56 94.0L410 94.0"/>
<text class="acc f" x="58" y="86.0" font-size="13" text-anchor="start">mean 3.00</text>
<text class="tb f" x="440" y="84" font-size="14" text-anchor="start">How it works</text>
<text class="s f" x="440" y="108" font-size="12.5" text-anchor="start">Add up the known values,</text>
<text class="s f" x="440" y="126" font-size="12.5" text-anchor="start">divide by how many there are:</text>
<text class="t m" x="440" y="156" font-size="12" text-anchor="start">(2.50 + 3.50 + 3.00) ÷ 3</text>
<text class="acc f" x="440" y="180" font-size="15" text-anchor="start">= 3.00</text>
<text class="s f" x="440" y="214" font-size="12.5" text-anchor="start">Rounded to the column's</text>
<text class="s f" x="440" y="231" font-size="12.5" text-anchor="start">own decimal places.</text>
</svg>
