<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Binary column conversion</title>
<desc id="dsc">Three two-state columns, TRUE and FALSE, 1 and 0, and Y and N, each converted to Yes and No. A note says a column of only 1s and 0s may be a number and needs confirming.</desc>
<defs>
<style>
.bg{fill:#fff;stroke:#d7ddd9;stroke-width:1.5}
.cell{fill:#fff;stroke:#b9c3bd;stroke-width:1.4}
.hdr{fill:#f6f8f7;stroke:#b9c3bd;stroke-width:1.4}
.gap{fill:url(#hatch);stroke:#b9c3bd;stroke-width:1.4}
.pad{fill:url(#hatch);stroke:none}
.ok{fill:#e2f1e8;stroke:#17724a;stroke-width:1.6}
.mark{fill:#fff0a0;stroke:#c9a800;stroke-width:1.6}
.bad{fill:#fdecea;stroke:#b3261e;stroke-width:1.6}
.info{fill:#e8f0f7;stroke:#1f4e79;stroke-width:1.6}
.sel{fill:none;stroke:#17724a;stroke-width:2.6}
.handle{fill:#17724a;stroke:#fff;stroke-width:2}
.accfill{fill:#17724a}
.onacc{fill:#fff;font-weight:700}
.hatchline{stroke:#56655d;stroke-opacity:.5;stroke-width:1.3}
.t{fill:#18231e}
.tb{fill:#18231e;font-weight:700}
.s{fill:#56655d}
.sb{fill:#56655d;font-weight:700}
.acc{fill:#0f5836;font-weight:700}
.mk{fill:#4d3f00}
.bd{fill:#b3261e;font-weight:700}
.nf{fill:#1f4e79;font-weight:700}
.wt{fill:#8a5300;font-weight:700}
.line{stroke:#56655d;stroke-width:1.6;fill:none}
.arrow{stroke:#17724a;stroke-width:2.4;fill:none}
.arrowhead{fill:#17724a}
.strike{stroke:#b3261e;stroke-width:2.2;fill:none}
.bar{fill:#b9c3bd}
.baracc{fill:#17724a}
.accline{stroke:#17724a;stroke-width:2.6;fill:none}
.dashacc{stroke:#17724a;stroke-width:2;stroke-dasharray:6 4;fill:none}
.warnline{stroke:#8a5300;stroke-width:2.2;stroke-dasharray:6 4;fill:none}
.dot{fill:#56655d}
.dotwarn{fill:#8a5300}
.dashed{stroke-dasharray:5 4}
.f{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
@media (prefers-color-scheme:dark){
.bg{fill:#171e1b;stroke:#2b3732}
.cell{fill:#1d2622;stroke:#3d4c45}
.hdr{fill:#232e29;stroke:#3d4c45}
.gap{stroke:#3d4c45}
.ok{fill:#1b3a2b;stroke:#4cc38a}
.mark{fill:#5a4e10;stroke:#b39b22}
.bad{fill:#3a1c1a;stroke:#ff9a92}
.info{fill:#1a2a3a;stroke:#9cc4ec}
.sel{stroke:#4cc38a}
.handle{fill:#4cc38a;stroke:#171e1b}
.accfill{fill:#4cc38a}
.onacc{fill:#07140e}
.hatchline{stroke:#9aaba2;stroke-opacity:.5}
.t,.tb{fill:#e6ede9}
.s,.sb{fill:#9aaba2}
.acc{fill:#7bd9ab}
.mk{fill:#fff3b0}
.bd{fill:#ff9a92}
.nf{fill:#9cc4ec}
.wt{fill:#f0c36b}
.line{stroke:#9aaba2}
.arrow{stroke:#4cc38a}
.arrowhead{fill:#4cc38a}
.strike{stroke:#ff9a92}
.bar{fill:#3d4c45}
.baracc{fill:#4cc38a}
.accline{stroke:#4cc38a}
.dashacc{stroke:#4cc38a}
.warnline{stroke:#f0c36b}
.dot{fill:#9aaba2}
.dotwarn{fill:#f0c36b}
}
</style>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="hatchline"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="1" y="1" width="638" height="298" rx="6"/>
<text class="sb f" x="30" y="32" font-size="12.5" text-anchor="start">Before</text>
<text class="sb f" x="298" y="32" font-size="12.5" text-anchor="start">After</text>
<rect class="cell" x="30" y="44" width="92" height="42" rx="2"/>
<text class="t m" x="76.0" y="70.2" font-size="14.5" text-anchor="middle">TRUE</text>
<rect class="cell" x="130" y="44" width="92" height="42" rx="2"/>
<text class="t m" x="176.0" y="70.2" font-size="14.5" text-anchor="middle">FALSE</text>
<path class="arrow" d="M234 65L286 65" marker-end="url(#ah)"/>
<rect class="ok" x="298" y="44" width="92" height="42" rx="2"/>
<text class="t m" x="344.0" y="70.2" font-size="14.5" text-anchor="middle">Yes</text>
<rect class="ok" x="398" y="44" width="92" height="42" rx="2"/>
<text class="t m" x="444.0" y="70.2" font-size="14.5" text-anchor="middle">No</text>
<rect class="cell" x="30" y="102" width="92" height="42" rx="2"/>
<text class="t m" x="76.0" y="128.2" font-size="14.5" text-anchor="middle">1</text>
<rect class="cell" x="130" y="102" width="92" height="42" rx="2"/>
<text class="t m" x="176.0" y="128.2" font-size="14.5" text-anchor="middle">0</text>
<path class="arrow" d="M234 123L286 123" marker-end="url(#ah)"/>
<rect class="ok" x="298" y="102" width="92" height="42" rx="2"/>
<text class="t m" x="344.0" y="128.2" font-size="14.5" text-anchor="middle">Yes</text>
<rect class="ok" x="398" y="102" width="92" height="42" rx="2"/>
<text class="t m" x="444.0" y="128.2" font-size="14.5" text-anchor="middle">No</text>
<rect class="cell" x="30" y="160" width="92" height="42" rx="2"/>
<text class="t m" x="76.0" y="186.2" font-size="14.5" text-anchor="middle">Y</text>
<rect class="cell" x="130" y="160" width="92" height="42" rx="2"/>
<text class="t m" x="176.0" y="186.2" font-size="14.5" text-anchor="middle">N</text>
<path class="arrow" d="M234 181L286 181" marker-end="url(#ah)"/>
<rect class="ok" x="298" y="160" width="92" height="42" rx="2"/>
<text class="t m" x="344.0" y="186.2" font-size="14.5" text-anchor="middle">Yes</text>
<rect class="ok" x="398" y="160" width="92" height="42" rx="2"/>
<text class="t m" x="444.0" y="186.2" font-size="14.5" text-anchor="middle">No</text>
<text class="wt f" x="504" y="106" font-size="12" text-anchor="start">Only 1s and 0s?</text>
<text class="wt f" x="504" y="122" font-size="12" text-anchor="start">You confirm it is</text>
<text class="wt f" x="504" y="138" font-size="12" text-anchor="start">a flag, not a</text>
<text class="wt f" x="504" y="154" font-size="12" text-anchor="start">number.</text>
<text class="s f" x="30" y="240" font-size="13" text-anchor="start">Each column picks its own style: TRUE/FALSE, Yes/No or 1/0.</text>
<text class="s f" x="30" y="262" font-size="13" text-anchor="start">Empty cells stay empty.</text>
</svg>
