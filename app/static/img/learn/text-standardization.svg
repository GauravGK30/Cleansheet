<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Text standardization</title>
<desc id="dsc">Four messy spellings of New York flow through four steps, trim, collapse spaces, change case and find and replace, into one standard value.</desc>
<defs>
<style>
.bg{fill:#fff;stroke:#d7ddd9;stroke-width:1.5}
.cell{fill:#fff;stroke:#b9c3bd;stroke-width:1.4}
.hdr{fill:#f6f8f7;stroke:#b9c3bd;stroke-width:1.4}
.gap{fill:url(#hatch);stroke:#b9c3bd;stroke-width:1.4}
.pad{fill:url(#hatch);stroke:none}
.ok{fill:#e2f1e8;stroke:#17724a;stroke-width:1.6}
.mark{fill:#fff0a0;stroke:#c9a800;stroke-width:1.6}
.bad{fill:#fdecea;stroke:#b3261e;stroke-width:1.6}
.info{fill:#e8f0f7;stroke:#1f4e79;stroke-width:1.6}
.sel{fill:none;stroke:#17724a;stroke-width:2.6}
.handle{fill:#17724a;stroke:#fff;stroke-width:2}
.accfill{fill:#17724a}
.onacc{fill:#fff;font-weight:700}
.hatchline{stroke:#56655d;stroke-opacity:.5;stroke-width:1.3}
.t{fill:#18231e}
.tb{fill:#18231e;font-weight:700}
.s{fill:#56655d}
.sb{fill:#56655d;font-weight:700}
.acc{fill:#0f5836;font-weight:700}
.mk{fill:#4d3f00}
.bd{fill:#b3261e;font-weight:700}
.nf{fill:#1f4e79;font-weight:700}
.wt{fill:#8a5300;font-weight:700}
.line{stroke:#56655d;stroke-width:1.6;fill:none}
.arrow{stroke:#17724a;stroke-width:2.4;fill:none}
.arrowhead{fill:#17724a}
.strike{stroke:#b3261e;stroke-width:2.2;fill:none}
.bar{fill:#b9c3bd}
.baracc{fill:#17724a}
.accline{stroke:#17724a;stroke-width:2.6;fill:none}
.dashacc{stroke:#17724a;stroke-width:2;stroke-dasharray:6 4;fill:none}
.warnline{stroke:#8a5300;stroke-width:2.2;stroke-dasharray:6 4;fill:none}
.dot{fill:#56655d}
.dotwarn{fill:#8a5300}
.dashed{stroke-dasharray:5 4}
.f{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
@media (prefers-color-scheme:dark){
.bg{fill:#171e1b;stroke:#2b3732}
.cell{fill:#1d2622;stroke:#3d4c45}
.hdr{fill:#232e29;stroke:#3d4c45}
.gap{stroke:#3d4c45}
.ok{fill:#1b3a2b;stroke:#4cc38a}
.mark{fill:#5a4e10;stroke:#b39b22}
.bad{fill:#3a1c1a;stroke:#ff9a92}
.info{fill:#1a2a3a;stroke:#9cc4ec}
.sel{stroke:#4cc38a}
.handle{fill:#4cc38a;stroke:#171e1b}
.accfill{fill:#4cc38a}
.onacc{fill:#07140e}
.hatchline{stroke:#9aaba2;stroke-opacity:.5}
.t,.tb{fill:#e6ede9}
.s,.sb{fill:#9aaba2}
.acc{fill:#7bd9ab}
.mk{fill:#fff3b0}
.bd{fill:#ff9a92}
.nf{fill:#9cc4ec}
.wt{fill:#f0c36b}
.line{stroke:#9aaba2}
.arrow{stroke:#4cc38a}
.arrowhead{fill:#4cc38a}
.strike{stroke:#ff9a92}
.bar{fill:#3d4c45}
.baracc{fill:#4cc38a}
.accline{stroke:#4cc38a}
.dashacc{stroke:#4cc38a}
.warnline{stroke:#f0c36b}
.dot{fill:#9aaba2}
.dotwarn{fill:#f0c36b}
}
</style>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="hatchline"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="1" y="1" width="638" height="298" rx="6"/>
<rect class="info" x="20" y="20" width="130" height="32" rx="16"/>
<text class="nf f" x="85" y="40.5" font-size="12.5" text-anchor="middle">1  Trim</text>
<path class="line" d="M150 36L170 36"/>
<rect class="info" x="170" y="20" width="130" height="32" rx="16"/>
<text class="nf f" x="235" y="40.5" font-size="12.5" text-anchor="middle">2  Collapse spaces</text>
<path class="line" d="M300 36L320 36"/>
<rect class="info" x="320" y="20" width="130" height="32" rx="16"/>
<text class="nf f" x="385" y="40.5" font-size="12.5" text-anchor="middle">3  Change case</text>
<path class="line" d="M450 36L470 36"/>
<rect class="info" x="470" y="20" width="130" height="32" rx="16"/>
<text class="nf f" x="535" y="40.5" font-size="12.5" text-anchor="middle">4  Find &amp; replace</text>
<text class="sb f" x="40" y="86" font-size="12.5" text-anchor="start">Messy</text>
<rect class="bad" x="40" y="94" width="160" height="34" rx="2"/>
<text class="bd m" x="120.0" y="116.2" font-size="14.5" text-anchor="middle">new··york</text>
<path class="arrow" d="M206 111L420 164" marker-end="url(#ah)"/>
<rect class="bad" x="40" y="136" width="160" height="34" rx="2"/>
<text class="bd m" x="120.0" y="158.2" font-size="14.5" text-anchor="middle">NEW YORK</text>
<path class="arrow" d="M206 153L420 174" marker-end="url(#ah)"/>
<rect class="bad" x="40" y="178" width="160" height="34" rx="2"/>
<text class="bd m" x="120.0" y="200.2" font-size="14.5" text-anchor="middle">New York·</text>
<path class="arrow" d="M206 195L420 184" marker-end="url(#ah)"/>
<rect class="bad" x="40" y="220" width="160" height="34" rx="2"/>
<text class="bd m" x="120.0" y="242.2" font-size="14.5" text-anchor="middle">nyc</text>
<path class="arrow" d="M206 237L420 194" marker-end="url(#ah)"/>
<text class="sb f" x="430" y="142" font-size="12.5" text-anchor="start">One standard value</text>
<rect class="ok" x="430" y="150" width="170" height="52" rx="2"/>
<text class="t m" x="515.0" y="182.1" font-size="17" text-anchor="middle">New York</text>
<text class="s f" x="430" y="232" font-size="12.5" text-anchor="start">Title Case, plus the rule</text>
<text class="s f" x="430" y="249" font-size="12.5" text-anchor="start">nyc → New York</text>
<text class="s f" x="40" y="280" font-size="12" text-anchor="start">A dot (·) marks a space.</text>
</svg>
