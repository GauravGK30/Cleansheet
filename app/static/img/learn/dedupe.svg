<path class="arrow" d="M290 168L372 168" marker-end="url(#ah)"/>
<text class="s f" x="331" y="152" font-size="12.5" text-anchor="middle">keep the first</text>
<text class="sb f" x="410" y="36" font-size="13" text-anchor="start">After: 3 rows</text>
<rect class="hdr" x="410" y="50" width="74" height="28" rx="2"/>
<text class="sb f" x="447.0" y="68.5" font-size="12.5" text-anchor="middle">Order</text>
<rect class="hdr" x="484" y="50" width="96" height="28" rx="2"/>
<text class="sb f" x="532.0" y="68.5" font-size="12.5" text-anchor="middle">Customer</text>
<rect class="ok" x="410" y="78" width="74" height="36" rx="2"/>
<text class="t m" x="447.0" y="101.0" font-size="14" text-anchor="middle">1001</text>
<rect class="ok" x="484" y="78" width="96" height="36" rx="2"/>
<text class="t m" x="532.0" y="101.0" font-size="14" text-anchor="middle">Ann</text>
<rect class="ok" x="410" y="114" width="74" height="36" rx="2"/>
<text class="t m" x="447.0" y="137.0" font-size="14" text-anchor="middle">1002</text>
<rect class="ok" x="484" y="114" width="96" height="36" rx="2"/>
<text class="t m" x="532.0" y="137.0" font-size="14" text-anchor="middle">Bo</text>
<rect class="ok" x="410" y="150" width="74" height="36" rx="2"/>
<text class="t m" x="447.0" y="173.0" font-size="14" text-anchor="middle">1003</text>
<rect class="ok" x="484" y="150" width="96" height="36" rx="2"/>
<text class="t m" x="532.0" y="173.0" font-size="14" text-anchor="middle">Cy</text>
<text class="s f" x="410" y="214" font-size="12.5" text-anchor="start">The first copy of each</text>
<text class="s f" x="410" y="231" font-size="12.5" text-anchor="start">row is the one kept.</text>
