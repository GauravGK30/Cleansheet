<rect class="bad" x="114" y="150" width="96" height="36" rx="2"/>
<text class="bd m" x="162.0" y="173.0" font-size="14" text-anchor="middle">Ann</text>
<rect class="cell" x="40" y="186" width="74" height="36" rx="2"/>
<text class="t m" x="77.0" y="209.0" font-size="14" text-anchor="middle">1003</text>
<rect class="cell" x="114" y="186" width="96" height="36" rx="2"/>
<text class="t m" x="162.0" y="209.0" font-size="14" text-anchor="middle">Cy</text>
